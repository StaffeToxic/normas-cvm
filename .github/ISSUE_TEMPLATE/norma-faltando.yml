name: Norma faltando
description: Uma norma da CVM que deveria estar no acervo e não está.
title: "[faltando] "
labels: ["norma-faltando"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Resolução
        - Instrução
        - Deliberação
        - Parecer de Orientação
        - Ofício Circular
        - Outro
    validations:
      required: true
  - type: input
    id: identificacao
    attributes:
      label: Número e ano
      placeholder: "Ex.: Resolução CVM 175/2022"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link oficial
      description: Página da norma no portal da CVM ou no DOU.
      placeholder: "https://conteudo.cvm.gov.br/legislacao/..."
    validations:
      required: true
  - type: textarea
    id: observacoes
    attributes:
      label: Observações
